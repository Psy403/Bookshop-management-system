{% extends "base.html" %}

{% block title %}New Sale{% endblock %}
{% block page_label %}Sales{% endblock %}
{% block page_title %}New Sale{% endblock %}

{% block content %}
<section class="mx-auto max-w-4xl">
    <div class="mb-6">
        <h2 class="text-xl font-semibold text-slate-900">Create New Sale</h2>
        <p class="mt-1 text-sm text-slate-500">Add one or more books to this customer sale.</p>
    </div>

    <form method="POST" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6">
        {% csrf_token %}
        <div id="sale-items" class="space-y-4">
            <div class="sale-item grid gap-4 rounded-xl border border-slate-200 bg-slate-50 p-4 sm:grid-cols-[1fr_140px_auto]">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-700">Book</label>
                    <select name="book" required class="book-select w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
                        <option value="">Select a book</option>
                        {% for book in books %}
                        <option value="{{ book.id }}">{{ book.title }} — Available: {% if book.stock %}{{ book.stock.quantity }}{% else %}0{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-700">Quantity</label>
                    <input type="number" name="quantity" min="1" required placeholder="Quantity" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
                </div>
                <button type="button" class="remove-item self-end rounded-xl border border-red-200 px-3 py-3 text-red-600 hover:bg-red-50" aria-label="Remove book">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
            </div>
        </div>

        <button type="button" id="add-item" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">
            <i class="fa-solid fa-plus"></i>
            Add Another Book
        </button>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end">
            <a href="{% url 'sale_list' %}" class="inline-flex items-center justify-center rounded-xl border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
            <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700">
                <i class="fa-solid fa-check"></i>
                Complete Sale
            </button>
        </div>
    </form>
</section>
{% load static %}
<script src="{% static 'sales/js/sale-form.js' %}" defer></script>
{% endblock %}
