<div class="flex items-center justify-between px-4 py-3 lg:hidden">

    <a href="#"
       class="text-lg font-semibold theme-primary-text">
        Book shop
    </a>
    <button
        id="menu-btn"
        class="mobile-menu-button rounded-lg px-4 py-3 text-white"
        type="button">
        <i class="fa-bars text-xl"></i>
    </button>

</div>
<div
    id="menu-overlay"
    class="fixed inset-0 z-40 hidden bg-black/40 lg:hidden">
</div>
<aside
    id="sidebar"
    class="theme-sidebar fixed inset-y-0 left-0 z-50 hidden w-72 p-0 shadow-2xl lg:flex lg:w-72 lg:flex-col lg:justify-between">

    <div>

        <div class="theme-divider border-b px-6 py-6">

            <p class="text-xs font-semibold uppercase tracking-[0.35em] theme-muted">
                BOok shop
            </p>

            <div class="mt-4 flex items-center gap-3">

                <div
                    class="sidebar-brand-avatar flex h-11 w-11 items-center justify-center rounded-full text-lg font-semibold">
                    S
                </div>

                <div>

                    <p class="font-semibold theme-primary-text">
                        Staff panel
                    </p>

                    <p class="text-sm theme-muted">
                        Bookshop Management
                    </p>

                </div>

            </div>

        </div>


        <nav class="mt-6 space-y-2 px-3">

            <a href="{% url 'dashboard' %}"
               class="{% if request.resolver_match.url_name == 'dashboard' %}sidebar-active-link{% else %}sidebar-link{% endif %} flex items-center gap-3 rounded-xl px-4 py-3 transition hover:text-white"
               {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>

                <span class="sidebar-link-icon text-base">
                    <i class="fa-solid fa-gauge-high"></i>
                </span>

                <span>
                    Dashboard
                </span>

            </a>


           

            <a href="{% url 'sale_list'%}"
               class="{% if request.resolver_match.url_name == 'sale_list' or request.resolver_match.url_name == 'sale_create' or request.resolver_match.url_name == 'sale_report' %}sidebar-active-link{% else %}sidebar-link{% endif %} flex items-center gap-3 rounded-xl px-4 py-3 transition hover:text-white"
               {% if request.resolver_match.url_name == 'sale_list' or request.resolver_match.url_name == 'sale_create' or request.resolver_match.url_name == 'sale_report' %}aria-current="page"{% endif %}>

                <span class="sidebar-link-icon text-base">
                    <i class="fa-solid fa-clipboard-list"></i>
                </span>

                <span>
                    Sales
                </span>

            </a>


            <a href="{% url 'book_stock_list' %}"
               class="{% if request.resolver_match.url_name == 'book_stock_list' %}sidebar-active-link{% else %}sidebar-link{% endif %} flex items-center gap-3 rounded-xl px-4 py-3 transition hover:text-white"
               {% if request.resolver_match.url_name == 'book_stock_list' %}aria-current="page"{% endif %}>

                <span class="sidebar-link-icon text-base">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                </span>

                <span>
                    Stock
                </span>

            </a>
            <a href="{% url 'category_list' %}"
               class="{% if request.resolver_match.url_name == 'category_list' or request.resolver_match.url_name == 'category_add' or request.resolver_match.url_name == 'category_edit' or request.resolver_match.url_name == 'category_delete' %}sidebar-active-link{% else %}sidebar-link{% endif %} flex items-center gap-3 rounded-xl px-4 py-3 transition hover:text-white"
               {% if request.resolver_match.url_name == 'category_list' or request.resolver_match.url_name == 'category_add' or request.resolver_match.url_name == 'category_edit' or request.resolver_match.url_name == 'category_delete' %}aria-current="page"{% endif %}>

                <span class="sidebar-link-icon text-base">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                </span>

                <span>
                    Category
                </span>

            </a>

            <a href="{% url 'return_list' %}"
               class="{% if request.resolver_match.url_name == 'return_list' or request.resolver_match.url_name == 'return_create' or request.resolver_match.url_name == 'return_report' %}sidebar-active-link{% else %}sidebar-link{% endif %} flex items-center gap-3 rounded-xl px-4 py-3 transition hover:text-white"
               {% if request.resolver_match.url_name == 'return_list' or request.resolver_match.url_name == 'return_create' or request.resolver_match.url_name == 'return_report' %}aria-current="page"{% endif %}>

                <span class="sidebar-link-icon text-base">
                    <i class="fa-solid fa-rotate-left"></i>
                </span>

                <span>
                    Returns
                </span>

            </a>

            <a href="{% url 'activity_list' %}"
               class="{% if request.resolver_match.url_name == 'activity_list' %}sidebar-active-link{% else %}sidebar-link{% endif %} flex items-center gap-3 rounded-xl px-4 py-3 transition hover:text-white"
               {% if request.resolver_match.url_name == 'activity_list' %}aria-current="page"{% endif %}>

                <span class="sidebar-link-icon text-base">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </span>

                <span>
                    Activity Logs
                </span>

            </a>


        </nav>

    </div>

    <div class="theme-divider border-t p-3">

        <form method="post" action="{% url 'staff_logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="theme-error-action flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left transition">

                <span class="text-base">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </span>

                <span>
                    Logout
                </span>

            </button>
        </form>

    </div>

</aside>
